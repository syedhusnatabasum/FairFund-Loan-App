<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | FairApp</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #e8fff7);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .admin-login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .admin-login-card {
            background: white;
            padding: 40px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(30, 50, 90, 0.15);
            text-align: center;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .fair {
            color: #3157d5;
        }

        .app {
            color: #0ca678;
        }

        .shield {
            font-size: 55px;
            margin: 15px 0;
        }

        h1 {
            color: #172554;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #263452;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            box-sizing: border-box;
            border: 1px solid #dce3ef;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #3157d5;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #3157d5, #0ca678);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            opacity: 0.9;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            text-decoration: none;
            color: #3157d5;
            font-weight: bold;
        }

        .flash-message {
            background: #ffecec;
            color: #c73e3e;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

    </style>

</head>

<body>

<div class="admin-login-container">

    <div class="admin-login-card">

        <div class="logo">
            <span class="fair">FAIR</span><span class="app">APP</span>
        </div>

        <div class="shield">
            🛡️
        </div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Secure access to FairApp Administration
        </p>

        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash-message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST" action="{{ url_for('admin_login') }}">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter admin email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter admin password"
                    required
                >

            </div>


            <button type="submit" class="login-btn">
                🔐 Login as Admin
            </button>

        </form>


        <a href="{{ url_for('index') }}" class="back-link">
            ← Back to FairApp
        </a>

    </div>

</div>

</body>

</html>
